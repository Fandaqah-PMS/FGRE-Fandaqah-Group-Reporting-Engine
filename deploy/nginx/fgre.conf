# FGRE nginx site. server-setup.sh fills __DOMAIN__, __APP_DIR__ and __PHP__.
# HTTPS: run `certbot --nginx -d __DOMAIN__` afterwards; it adds the 443 block and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __APP_DIR__/public;

    index index.php;
    charset utf-8;
    client_max_body_size 30M;          # report uploads up to 25 MB

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets have hashed names: cache them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles (.env, .git) or other PHP files.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
