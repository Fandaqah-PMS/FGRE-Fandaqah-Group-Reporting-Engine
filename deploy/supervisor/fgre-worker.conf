; FGRE queue worker: reads received reports, sends emails. server-setup.sh fills __APP_DIR__ / __APP_USER__.
; deploy.sh runs `artisan queue:restart`; supervisor starts the workers again on the new code.
[program:fgre-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work database --sleep=3 --tries=3 --timeout=150 --max-time=3600
directory=__APP_DIR__
user=__APP_USER__
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
